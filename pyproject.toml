[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "0.1.0"
dependencies = [
    "langchain",
    "langchain-groq",
    "langchain-huggingface",
    "chromadb",
    "sentence-transformers",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_core*"]